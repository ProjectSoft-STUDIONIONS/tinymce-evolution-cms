name: Tinymce Auto-Update & Release

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Шаг 1: обновляем версии и теги
      - name: Check tinymce tags and update JSON + package.json
        id: check-update
        run: node scripts/check-tinymce-and-update.js

      # Если есть мажорная версия - созаём Issue
      - name: Report major version mismatch as Issue
        if: steps.check-update.outputs.major == 'true'
        uses: peter-evans/create-issue@v3
        with:
          title: "Auto-alert: New TinyMCE major version detected (v${{ steps.check-update.outputs.majorVersion }})"
          body: |
            ⚠️ **Major version mismatch detected**

            A new major version of TinyMCE has been released: **v${{ steps.check-update.outputs.majorVersion }}**.

            The current plugin build is **not yet ready** to support this major version.

            This release was still created with the supported versions only.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: alert, needs-review

      # Если нет обновлений. Выход
      - name: Exit if no updates
        if: steps.check-update.outputs.updated == 'false'
        run: echo "No updates found. Stopping workflow." && exit 0

      # Шаг 2: собираем проект (только если есть обновления)
      - name: Build project
        if: steps.check-update.outputs.updated == 'true'
        run: npm run build

      # Шаг 3: готовим список архивов
      - name: Prepare artifact list (tinymce-*.zip)
        if: steps.check-update.outputs.updated == 'true'
        id: prepare-artifacts
        run: |
          ARTIFACTS=$(find . -maxdepth 1 -type f -name "tinymce-*.zip" | tr '\n' ',' | sed 's/,$//')
          if [ -z "$ARTIFACTS" ]; then
            echo "❌ No tinymce-*.zip files found!"
            exit 1
          fi
          echo "Found artifacts: $ARTIFACTS"
          echo "artifacts=$ARTIFACTS" >> $GITHUB_OUTPUT

      # Шаг 4: ОДИН общий коммит
      - name: Commit all changes
        if: steps.check-update.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update tinymce accepted tags, bump version, update README"
          branch: main

      # Шаг 5: релиз
      - name: Create Release
        if: steps.check-update.outputs.updated == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: "TinyMCE for EvolutionCMS v${{ steps.check-update.outputs.new-version }}"
          body: |
            New project version: ${{ steps.check-update.outputs.new-version }}
            Updated tinymce tags.
          tag: "${{ steps.check-update.outputs.new-version }}"
          artifacts: "${{ steps.prepare-artifacts.outputs.artifacts }}"
