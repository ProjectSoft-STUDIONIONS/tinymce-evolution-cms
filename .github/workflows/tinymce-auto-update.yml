name: Tinymce Auto-Update & Release

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Временная замена для отладки: npm install вместо npm ci
      - name: Install dependencies
        run: npm install

      - name: Check tinymce tags and update JSON + package.json
        id: check-update
        run: node scripts/check-tinymce-and-update.js

      - name: Exit if no updates
        if: steps.check-update.outputs.updated == 'false'
        run: echo "No updates found. Stopping workflow." && exit 0

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update tinymce accepted tags and bump version"
          branch: main

      - name: Build project
        run: npm run build

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: "Tinymce auto-update v${{ steps.check-update.outputs.new-version }}"
          body: |
            Automated release triggered by scheduled check.
            New project version: ${{ steps.check-update.outputs.new-version }}
            Updated tinymce tags were detected and JSON updated.
          tag: "TinyMCE for EvolutionCMS v${{ steps.check-update.outputs.new-version }}"
