name: Test - Create Issue (Manual Only)

on:
  workflow_dispatch:  # Только ручной запуск, чтобы не спамить

jobs:
  test-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Test Issue via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="TEST: Manual Issue Creation"
          BODY="✅ This issue was created by the test workflow to verify API access.\n\nIf you see this, GitHub Actions can create Issues with the current GITHUB_TOKEN."

          curl -s -w "\nStatus: %{http_code}" -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/issues" \
            -d "{\"title\":\"${TITLE}\",\"body\":\"${BODY}\"}"
